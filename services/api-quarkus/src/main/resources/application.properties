quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/devpulse}
quarkus.datasource.username=${DB_USER:devpulse}
quarkus.datasource.password=${DB_PASSWORD:devpulse}
# OpenAPI e Swagger UI visível em dev e prod (T8)
quarkus.smallrye-openapi.info-title=DevPulse API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# Desativa o Dev Services automatico para usar o container devpulse-postgres do docker-compose
quarkus.datasource.devservices.enabled=false

# Migracoes Flyway ativas na subida
quarkus.flyway.migrate-at-start=true

# PROIBIDO DDL automatico pelo Hibernate
quarkus.hibernate-orm.schema-management.strategy=none

# Porta da aplicação
quarkus.http.port=8080

quarkus.swagger-ui.always-include=true