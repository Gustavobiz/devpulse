# Configuração do PostgreSQL com suporte a variaveis de ambiente
quarkus.datasource.db-kind=postgresql
prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/devpulse}
prod.quarkus.datasource.username=${DB_USER:devpulse}
prod.quarkus.datasource.password=${DB_PASSWORD:devpulse}

# Migrações Flyway ativas na subida
quarkus.flyway.migrate-at-start=true

# PROIBIDO DDL automático pelo hibernate 
quarkus.hibernate-orm.schema-management.strategy=none

# Porta da aplicaçao
quarkus.http.port=8080s