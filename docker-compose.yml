version: "3.8"

services:
  api-quarkus:
    build:
      context: ./services/api-quarkus
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_HTTP_PORT=8080

  busca:
    build:
      context: ./services/busca
    ports:
      - "8081:8081"

  conciliacao:
    build:
      context: ./services/conciliacao
    ports:
      - "8082:8082"
