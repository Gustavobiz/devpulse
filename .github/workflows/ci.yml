name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-java:
    name: Build API Principal (Quarkus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
      - run: cd services/api-quarkus && chmod +x mvnw && ./mvnw compile

  build-go:
    name: Build Serviços em Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: |
          cd services/busca && go build ./...
          cd ../conciliacao && go build ./...
