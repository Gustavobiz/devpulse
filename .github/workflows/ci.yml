name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-quarkus:
    name: Build & Test Quarkus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build & Test Quarkus
        run: ./mvnw test
        working-directory: ./services/api-quarkus

  test-go-services:
    name: Build & Test Go Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Test Busca Service
        run: go test ./...
        working-directory: ./services/busca

      - name: Test Conciliacao Service
        run: go test ./...
        working-directory: ./services/conciliacao
